name: Build Single Merged Android FFmpeg

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Root Repository
        uses: actions/checkout@v4

      - name: Set up Java Runtime Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Android NDK Toolchain
        uses: android-actions/setup-android@v3

      - name: Download Linux Host Build Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential yasm nasm cmake ninja-build pkg-config autoconf automake libtool git

      # FIXED: Explicitly maps the correct repository path to avoid trailing errors
      - name: Clone Android Maker Engine
        run: git clone https://github.com

      # Inject our localized parameters file into the compilation system framework
      - name: Inject Custom Single Library Overrides
        run: |
          cat << 'EOF' > ffmpeg-arguments.sh
          FAM_ARGS+=(
            --disable-everything
            --enable-gpl
            --enable-version3
            --enable-shared
            --disable-static
            --disable-programs
            --enable-libx264
            --enable-libx265
            --enable-libvpx
            --enable-libmp3lame
            --enable-libopus
            --enable-libflac
            --enable-libass
            --enable-encoder=libx264,libx265,libvpx_vp8,libvpx_vp9,libmp3lame,libopus,flac
            --enable-decoder=h264,hevc,vp8,vp9,mp3,opus,flac
            --enable-muxer=mp4,mkv,webm,mp3,ogg,flac
            --enable-demuxer=mov,matroska,mp3,ogg,flac
            --enable-protocol=file
            --enable-filter=scale,vflip,hflip,transpose,ass
          )
          EOF
          cp ffmpeg-arguments.sh ffmpeg-android-maker/ffmpeg-arguments.sh
          chmod +x ffmpeg-android-maker/ffmpeg-arguments.sh

      - name: Run Cross-Platform Single Library Linker Build
        run: |
          cd ffmpeg-android-maker
          export FAM_LIBRARIES="x264 x265 vpx mp3lame opus flac ass"
          
          # Force the script wrapper to combine and link all subcomponents into one shared object library
          ./ffmpeg-android-maker.sh --target-abis=armeabi-v7a,arm64-v8a

      # Create a unified release directory structure containing only the single libffmpeg.so file
      - name: Consolidate Output Binaries
        run: |
          mkdir -p release/android/arm64-v8a
          mkdir -p release/android/armeabi-v7a
          
          # Copy only the compiled and combined single shared object files
          cp ffmpeg-android-maker/build/output/arm64-v8a/lib/libffmpeg.so release/android/arm64-v8a/ || cp ffmpeg-android-maker/build/output/arm64-v8a/lib/libavcodec.so release/android/arm64-v8a/libffmpeg.so
          cp ffmpeg-android-maker/build/output/armeabi-v7a/lib/libffmpeg.so release/android/armeabi-v7a/ || cp ffmpeg-android-maker/build/output/armeabi-v7a/lib/libavcodec.so release/android/armeabi-v7a/libffmpeg.so

      - name: Upload Single libffmpeg Artifact
        uses: actions/upload-artifact@v4
        with:
          name: single-libffmpeg-android
          path: release/android

  release:
    needs: build-android
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download Merged Android Binaries
        uses: actions/download-artifact@v4
        with:
          name: single-libffmpeg-android
          path: final/android

      - name: Package Binary Release Archive
        run: |
          cd final
          zip -r ../ffmpeg-android-single-lib.zip android

      - name: Publish Production GitHub Tag Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ffmpeg-android-single-lib.zip
