name: Android FFmpeg Builder

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ABI: arm64-v8a
      API_LEVEL: 33
      NDK_VERSION: r26d

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt update

          sudo apt install -y \
          git \
          wget \
          unzip \
          curl \
          pkg-config \
          build-essential \
          autoconf \
          automake \
          cmake \
          libtool \
          yasm \
          nasm \
          meson \
          ninja-build

      - name: Download Android NDK
        run: |

          wget https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip

          unzip android-ndk-${NDK_VERSION}-linux.zip

          echo "NDK=$PWD/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV

      - name: Make scripts executable
        run: |

          chmod +x scripts/*.sh

      - name: Validate configuration
        run: |

          bash scripts/validate_config.sh

      - name: Build and package FFmpeg
        run: |

          bash scripts/build.sh

      - name: Upload Artifact

        uses: actions/upload-artifact@v4

        with:
          name: ffmpeg-android-arm64-v8a
          path: output/

      - name: Publish Release

        if: startsWith(github.ref, 'refs/tags/')

        uses: softprops/action-gh-release@v2

        with:
          files: |
            output/*

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
