name: Android FFmpeg Builder

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      ABI: arm64-v8a
      API_LEVEL: 33
      NDK_VERSION: r26d

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt update

          sudo apt install -y \
          git \
          wget \
          unzip \
          curl \
          pkg-config \
          build-essential \
          autoconf \
          automake \
          cmake \
          gettext \
          gperf \
          libtool \
          xz-utils \
          yasm \
          nasm \
          meson \
          ninja-build

      - name: Download Android NDK
        run: |

          wget https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip

          unzip android-ndk-${NDK_VERSION}-linux.zip

          echo "NDK=$PWD/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV

      - name: Make scripts executable
        run: |

          chmod +x scripts/*.sh

      - name: Validate configuration
        run: |

          bash scripts/validate_config.sh

      - name: Build and package FFmpeg
        run: |

          bash scripts/build.sh

      - name: Create release package
        run: |

          mkdir -p release
          tar -czf release/ffmpeg-android-arm64-v8a.tar.gz -C output .
          cp output/build-info.txt release/build-info.txt
          cp output/libs/libffmpeg.so release/libffmpeg.so

      - name: Upload Artifact

        uses: actions/upload-artifact@v4

        with:
          name: ffmpeg-android-arm64-v8a
          path: |
            output/
            release/ffmpeg-android-arm64-v8a.tar.gz

      - name: Publish Release

        uses: softprops/action-gh-release@v2

        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('FFmpeg Android {0}', github.ref_name) || 'Latest FFmpeg Android Build' }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') }}
          files: |
            release/ffmpeg-android-arm64-v8a.tar.gz
            release/libffmpeg.so
            release/build-info.txt

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
