name: Android FFmpeg Builder

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      ABI: arm64-v8a
      API_LEVEL: 33
      NDK_VERSION: r26d

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install packages
        run: |
          sudo apt update

          sudo apt install -y \
          git \
          wget \
          unzip \
          curl \
          pkg-config \
          build-essential \
          autoconf \
          automake \
          cmake \
          gettext \
          gperf \
          libtool \
          xz-utils \
          yasm \
          nasm \
          meson \
          ninja-build

      - name: Install Android NDK
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/26.3.11579264"
          if [ -d "$NDK_DIR" ]; then
            echo "✅ Pre-installed NDK found at $NDK_DIR"
            echo "NDK=$NDK_DIR" >> $GITHUB_ENV
            exit 0
          fi

          echo "Installing NDK via sdkmanager..."
          for attempt in 1 2 3; do
            echo "Attempt $attempt: Installing NDK via sdkmanager..."
            echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --verbose "ndk;26.3.11579264" && break
            if [ $attempt -lt 3 ]; then
              echo "Attempt $attempt failed, retrying in 45s..."
              sleep 45
            fi
          done

          if [ ! -d "$NDK_DIR" ]; then
            echo "sdkmanager failed, downloading direct NDK zip with browser User-Agent..."
            curl -A "Mozilla/5.0 (X11; Linux x86_64)" -L --fail --retry 5 --retry-delay 10 \
              -o android-ndk-r26d-linux.zip \
              "https://dl.google.com/android/repository/android-ndk-r26d-linux.zip"
            unzip -q android-ndk-r26d-linux.zip
            NDK_DIR="$PWD/android-ndk-r26d"
          fi

          echo "NDK=$NDK_DIR" >> $GITHUB_ENV

      - name: Make scripts executable
        run: |

          chmod +x scripts/*.sh

      - name: Validate configuration
        run: |

          bash scripts/validate_config.sh

      - name: Build and package FFmpeg
        run: |

          bash scripts/build.sh

      - name: Create release package
        run: |

          mkdir -p release
          tar -czf release/ffmpeg-android-arm64-v8a.tar.gz -C output .
          cp output/build-info.txt release/build-info.txt
          cp output/libs/libffmpeg.so release/libffmpeg.so
          cat > release/release-notes.md <<EOF
          # FFmpeg Android Build

          This release contains the latest Android arm64-v8a FFmpeg build.

          ## Highlights

          - FFmpeg 8.1.2
          - Node.js 24 GitHub Actions runtime
          - Android API 33+
          - Single shared library output: libffmpeg.so
          - libavdevice enabled
          - libx264 enabled for H.264 software encoding
          - libx265 enabled for H.265 / HEVC software encoding
          - libvpx enabled for VP8 / VP9 software encoding and decoding
          - libmp3lame enabled for high quality MP3 encoding
          - libavif enabled for AVIF image encoding and decoding via libaom
          - MediaCodec enabled for H.264 and HEVC hardware encoding
          - MediaCodec enabled for H.264, HEVC, VP8, and VP9 hardware decoding
          - libass subtitle rendering with FreeType, HarfBuzz, FriBidi, FontConfig, and Expat

          ## Assets

          - ffmpeg-android-arm64-v8a.tar.gz: complete output package
          - libffmpeg.so: direct shared library download
          - build-info.txt: build feature summary

          Note: x264 and x265 are GPL-licensed, so this is a GPL FFmpeg build.
          EOF

      - name: Update latest source tag
        if: github.event_name == 'workflow_dispatch'
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

      - name: Upload Artifact

        uses: actions/upload-artifact@v7

        with:
          name: ffmpeg-android-arm64-v8a
          path: |
            output/
            release/ffmpeg-android-arm64-v8a.tar.gz

      - name: Publish Release

        uses: softprops/action-gh-release@v3

        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('FFmpeg Android {0}', github.ref_name) || 'Latest FFmpeg Android Build' }}
          target_commitish: ${{ github.sha }}
          body_path: release/release-notes.md
          prerelease: false
          make_latest: true
          files: |
            release/ffmpeg-android-arm64-v8a.tar.gz
            release/libffmpeg.so
            release/build-info.txt

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
