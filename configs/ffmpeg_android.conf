# =====================================
# FFmpeg Android Production Config
# =====================================

# Platform
--target-os=android
--arch=aarch64
--cpu=armv8-a
--enable-cross-compile
--enable-pic
--enable-jni

# Build type
--enable-shared
--disable-static
--disable-programs
--disable-debug
--disable-doc

# Licensing (required for x264/x265)
--enable-gpl
--enable-version3

# =====================================
# VIDEO CODECS
# =====================================
--enable-libx264
--enable-libx265
--enable-libvpx
--enable-libdav1d

# Hardware encode/decode
--enable-mediacodec

# =====================================
# AUDIO CODECS
# =====================================
--enable-libopus
--enable-libmp3lame
--enable-libflac
--enable-libvorbis

# Native AAC (Android best)
--enable-encoder=aac

# =====================================
# SUBTITLES (CAPCUT-STYLE)
# =====================================
--enable-libass
--enable-libfreetype
--enable-libharfbuzz
--enable-libfribidi

# =====================================
# FORMATS (CONTAINERS)
# =====================================
--enable-muxer=mp4
--enable-muxer=mov
--enable-muxer=matroska
--enable-muxer=webm
--enable-muxer=mpegts

--enable-demuxer=mp4
--enable-demuxer=matroska
--enable-demuxer=mpegts
--enable-demuxer=mov

# =====================================
# FILTERS (VIDEO EDITING CORE)
# =====================================
--enable-avfilter
--enable-filter=scale
--enable-filter=crop
--enable-filter=overlay
--enable-filter=transpose
--enable-filter=subtitles
--enable-filter=ass

# =====================================
# PERFORMANCE
# =====================================
--enable-small
--disable-ffmpeg
--disable-ffplay
--disable-ffprobe
