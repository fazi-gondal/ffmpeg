# ==========================================
# SUBTITLE ENGINE (CORE)
# ==========================================

ENABLE_SUBTITLES=yes

# Soft subtitles (streams)
ENABLE_SRT=yes
ENABLE_ASS=yes
ENABLE_SSA=yes
ENABLE_WEBVTT=yes

# Burn-in subtitles (render into video)
ENABLE_SUBTITLE_BURN=yes

# ==========================================
# ADVANCED SUBTITLE ENGINE (LIBASS STACK)
# ==========================================

ENABLE_LIBASS=yes
ENABLE_LIBASS_RENDER=yes

ENABLE_FREETYPE=yes       # font rendering engine
ENABLE_HARFBUZZ=yes       # text shaping engine
ENABLE_FRIBIDI=yes        # RTL support (Urdu / Arabic)
ENABLE_FONTCONFIG=yes     # system font management

# ==========================================
# SUBTITLE STYLING FEATURES
# ==========================================

ENABLE_FONT_SIZE=yes
ENABLE_FONT_COLOR=yes
ENABLE_FONT_STYLE=yes

ENABLE_OUTLINE=yes        # stroke / border
ENABLE_SHADOW=yes         # drop shadow
ENABLE_BACKGROUND=yes     # text box background

ENABLE_POSITIONING=yes    # x/y positioning on video
ENABLE_ALIGNMENT=yes      # left/center/right/bottom/top

# ==========================================
# CAPCUT-STYLE FEATURES
# ==========================================

ENABLE_SUBTITLE_ANIMATION=no   # fade/slide subtitles (optional advanced)

ENABLE_TIMED_SUBTITLES=yes     # time-based rendering
ENABLE_MULTI_LINE=yes          # multiline captions

ENABLE_WORD_LEVEL_TIMING=no    # karaoke-style (advanced)

# ==========================================
# LANGUAGE SUPPORT
# ==========================================

ENABLE_UTF8=yes

ENABLE_RTL_SUPPORT=yes         # Urdu, Arabic, Persian, Hebrew
ENABLE_LTR_SUPPORT=yes

ENABLE_BIDI_PROCESSING=yes     # bidirectional text support

# ==========================================
# FONT SYSTEM
# ==========================================

ENABLE_CUSTOM_FONTS=yes

ENABLE_SYSTEM_FONTS=yes

FONT_CACHE=yes

DEFAULT_FONT="Roboto"

# ==========================================
# RENDERING MODES
# ==========================================

SUBTITLE_RENDER_MODE=libass   # libass renderer (recommended)

ENABLE_SOFTWARE_RENDER=yes
ENABLE_HARDWARE_ACCEL_SUBTITLES=no

# ==========================================
# PERFORMANCE OPTIONS
# ==========================================

ENABLE_SUBTITLE_CACHE=yes
ENABLE_PRE_RENDER_SUBTITLES=yes

# ==========================================
# FUTURE FEATURES (DISABLED)
# ==========================================

ENABLE_KARAOKE_EFFECT=no
ENABLE_REALTIME_SUBTITLE_EDIT=no
ENABLE_AI_SUBTITLE_SYNC=no
ENABLE_TRANSLATION_SUBTITLES=no