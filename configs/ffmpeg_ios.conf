# =====================================
# FFmpeg iOS Production Config
# =====================================

# Platform
--target-os=darwin
--arch=arm64
--enable-cross-compile

# Compiler
--cc="xcrun -sdk iphoneos clang"
--sysroot="$(xcrun -sdk iphoneos --show-sdk-path)"

# Build type
--enable-pic
--enable-shared
--disable-static
--disable-programs
--disable-debug
--disable-doc

# Licensing
--enable-gpl
--enable-version3

# =====================================
# VIDEO CODECS
# =====================================
--enable-libx264
--enable-libx265
--enable-libvpx

# Hardware acceleration (iOS best feature)
--enable-videotoolbox

# =====================================
# AUDIO CODECS
# =====================================
--enable-libopus
--enable-libmp3lame
--enable-libflac
--enable-libvorbis

# Native AAC (iOS best)
--enable-encoder=aac

# =====================================
# SUBTITLES
# =====================================
--enable-libass
--enable-libfreetype
--enable-libharfbuzz
--enable-libfribidi

# =====================================
# CONTAINERS
# =====================================
--enable-muxer=mp4
--enable-muxer=mov
--enable-muxer=matroska
--enable-muxer=webm

--enable-demuxer=mp4
--enable-demuxer=mov
--enable-demuxer=matroska

# =====================================
# FILTERS
# =====================================
--enable-avfilter
--enable-filter=scale
--enable-filter=crop
--enable-filter=overlay
--enable-filter=subtitles
--enable-filter=ass

# =====================================
# OPTIMIZATION
# =====================================
--enable-small
--disable-ffmpeg
--disable-ffplay
--disable-ffprobe
