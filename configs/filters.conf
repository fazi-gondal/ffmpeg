# ==========================================
# VIDEO FILTERS (CORE EDITING ENGINE)
# ==========================================

ENABLE_SCALE=yes          # Resize video
ENABLE_CROP=yes           # Crop frames
ENABLE_OVERLAY=yes        # PIP / stickers / watermark
ENABLE_ROTATE=yes         # rotate / transpose
ENABLE_FLIP=yes           # horizontal / vertical flip

ENABLE_FPS=yes            # change frame rate
ENABLE_SETPTS=yes         # timeline control (trim, speed)
ENABLE_FRAMERATE=yes

# Transitions
ENABLE_FADE=yes           # fade in/out
ENABLE_XFADE=no           # crossfade (optional heavy)

# Motion effects
ENABLE_ZOOMPAN=yes        # zoom + pan animation

# Color effects
ENABLE_COLORBALANCE=no
ENABLE_BRIGHTNESS_CONTRAST=yes
ENABLE_HUE_SATURATION=yes

# Blur / sharpen
ENABLE_GAUSSIAN_BLUR=yes
ENABLE_UNSHARP=no

# ==========================================
# TEXT / SUBTITLE FILTERS
# ==========================================

ENABLE_SUBTITLES=yes      # SRT burn-in
ENABLE_ASS=yes            # styled subtitles (libass)
ENABLE_DRAWBOX=yes        # text background boxes
ENABLE_DRAWTEXT=yes       # optional text rendering

# Subtitle rendering engine
ENABLE_LIBASS_RENDER=yes

# Styling support (CapCut-like subtitles)
ENABLE_SUBTITLE_STYLES=yes
ENABLE_FONT_CUSTOMIZATION=yes

# ==========================================
# AUDIO FILTERS
# ==========================================

ENABLE_VOLUME=yes
ENABLE_AMIX=yes           # audio mixing
ENABLE_ARESAMPLE=yes      # resampling
ENABLE_LOUDNORM=yes       # loudness normalization

ENABLE_ECHO=no
ENABLE_REVERB=no

# ==========================================
# AUDIO EDITING FEATURES
# ==========================================

ENABLE_AUDIO_TRIM=yes
ENABLE_AUDIO_FADE=yes

# Multi-track audio support
ENABLE_MULTI_AUDIO_TRACKS=yes

# ==========================================
# VIDEO EDITING FEATURES
# ==========================================

ENABLE_VIDEO_TRIM=yes
ENABLE_VIDEO_SPLIT=yes

ENABLE_SPEED_CONTROL=yes  # slow motion / fast motion

# ==========================================
# SOCIAL MEDIA EDITOR FEATURES
# ==========================================

ENABLE_TIMELINE_SYNC=yes
ENABLE_FRAME_ACCURATE_EDITING=yes

ENABLE_STICKER_OVERLAY=yes
ENABLE_IMAGE_OVERLAY=yes

# ==========================================
# PERFORMANCE OPTIMIZATION
# ==========================================

ENABLE_HARDWARE_ACCEL_FILTERS=yes  # MediaCodec where possible
ENABLE_SOFTWARE_FALLBACK=yes

# ==========================================
# ADVANCED (DISABLED BY DEFAULT)
# ==========================================

ENABLE_CHROMAKEY=no
ENABLE_KEYING=no
ENABLE_GLTRANSFORM=no
ENABLE_VULKAN_FILTERS=no