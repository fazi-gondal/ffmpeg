# ==========================================
# VIDEO CODECS
# ==========================================

# Native FFmpeg codecs
CODEC_H264=yes
CODEC_H265=yes
CODEC_MPEG4=yes
CODEC_VP8=yes
CODEC_VP9=yes
CODEC_MJPEG=yes

# Android MediaCodec
MEDIACODEC_H264=yes
MEDIACODEC_HEVC=yes
MEDIACODEC_VP8=yes
MEDIACODEC_VP9=yes

# Optional software codecs
CODEC_X264=no
CODEC_X265=no

# Future codecs
CODEC_AV1=no
CODEC_SVTAV1=no
CODEC_RAV1E=no
CODEC_THEORA=no

# ==========================================
# AUDIO CODECS
# ==========================================

CODEC_AAC=yes
CODEC_MP3=yes
CODEC_FLAC=yes
CODEC_OPUS=yes
CODEC_PCM=yes

# Optional
CODEC_VORBIS=no
CODEC_SPEEX=no
CODEC_ALAC=no
CODEC_FDK_AAC=no

# ==========================================
# DECODERS
# ==========================================

ENABLE_DECODERS=yes

# ==========================================
# ENCODERS
# ==========================================

ENABLE_ENCODERS=yes

# ==========================================
# HARDWARE ENCODERS
# ==========================================

ENABLE_MEDIACODEC_ENCODERS=yes

# ==========================================
# HARDWARE DECODERS
# ==========================================

ENABLE_MEDIACODEC_DECODERS=yes

# ==========================================
# MULTI STREAM SUPPORT
# ==========================================

ENABLE_MULTI_AUDIO_TRACKS=yes
ENABLE_MULTI_SUBTITLE_TRACKS=yes

# ==========================================
# SOCIAL MEDIA EDITOR FEATURES
# ==========================================

ENABLE_AUDIO_MIXING=yes
ENABLE_VIDEO_OVERLAY=yes
ENABLE_VIDEO_ROTATION=yes
ENABLE_VIDEO_SCALING=yes
ENABLE_VIDEO_TRIMMING=yes

# ==========================================
# OPTIONAL FUTURE FEATURES
# ==========================================

ENABLE_DOLBY_VISION=no
ENABLE_HDR10=no
ENABLE_HDR10PLUS=no