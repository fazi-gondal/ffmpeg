# ==========================================
# Android Target
# ==========================================

TARGET_OS=android
TARGET_ARCH=aarch64
TARGET_ABI=arm64-v8a
ANDROID_API=33

# ==========================================
# Build Options
# ==========================================

BUILD_SHARED=yes
BUILD_STATIC=no

ENABLE_GPL=yes
ENABLE_VERSION3=yes

ENABLE_SMALL=no

# ==========================================
# Hardware Acceleration
# ==========================================

ENABLE_MEDIACODEC=yes

ENABLE_H264_MEDIACODEC=yes
ENABLE_HEVC_MEDIACODEC=yes
ENABLE_VP8_MEDIACODEC=yes
ENABLE_VP9_MEDIACODEC=yes

# ==========================================
# FFmpeg Core
# ==========================================

FFMPEG_VERSION=8.1.2

ENABLE_AVCODEC=yes
ENABLE_AVFORMAT=yes
ENABLE_AVFILTER=yes
ENABLE_AVUTIL=yes
ENABLE_SWSCALE=yes
ENABLE_SWRESAMPLE=yes

# ==========================================
# Subtitle Engine
# ==========================================

ENABLE_LIBASS=yes
ENABLE_FREETYPE=yes
ENABLE_HARFBUZZ=yes
ENABLE_FRIBIDI=yes
ENABLE_FONTCONFIG=yes

ENABLE_ASS_FILTER=yes
ENABLE_SUBTITLE_FILTER=yes

# ==========================================
# Editor Features
# ==========================================

ENABLE_MULTI_AUDIO=yes
ENABLE_MULTI_SUBTITLE=yes

ENABLE_SUBTITLE_BURN=yes

# ==========================================
# Runtime Programs
# ==========================================

BUILD_FFMPEG=yes
BUILD_FFPROBE=yes

BUILD_FFPLAY=no

# ==========================================
# Documentation
# ==========================================

ENABLE_DOC=no
ENABLE_DEBUG=no

# ==========================================
# Optimisation
# ==========================================

ENABLE_LTO=yes
STRIP_BINARIES=yes

# ==========================================
# Output
# ==========================================

OUTPUT_SINGLE_SO=yes

OUTPUT_NAME=libffmpeg.so

# ==========================================
# Future Features
# Disabled by default
# ==========================================

ENABLE_X264=no
ENABLE_X265=no

ENABLE_AV1=no
ENABLE_SVTAV1=no

ENABLE_VULKAN=no
ENABLE_OPENCL=no

ENABLE_CUDA=no
ENABLE_VAAPI=no

ENABLE_QSV=no
ENABLE_VIDEOTOOLBOX=no
